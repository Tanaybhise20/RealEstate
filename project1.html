<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RealEstate</title>
    <style>
        *{
          margin: 0;
          padding: 0;
          box-sizing: border-box;
        }
        body{
            width: 1440px;
           overflow-x: hidden;
           font-family: 'Poppins', sans-serif;
        }
       .navbar{
           display: flex;
           width: 1440;
           height: 125;
           justify-content: space-between;
           angle: 0 deg;
           opacity: 1;
           border-bottom-width: 1px;
           padding-right: 100px;
           padding-left: 70px;
           border-bottom: 1px solid #E4E4E4;
           padding-top: 40px;
           padding-bottom: 40px;
        }
       .logo{
           width: 133.12960815429688;
           height: 44;
           angle: 0 deg;
           opacity: 1;
           gap: 12px;
        }
        
.nav-menu {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 35px;
}

.nav-menu a {
    text-decoration: none;
    color: #333;
    font-size: 18px;
    font-family: Arial, sans-serif;
    font-weight: 400;
    white-space: nowrap;
}

.nav-menu a:hover {
    color: #278cff;
}

.nav-menu .btn {
    background-color: #278cff;
    border: none;
    border-radius: 5px;
    padding: 10px 20px;
    cursor: pointer;
    white-space: nowrap;
}

.nav-menu .btn a {
    color: white;
    font-size: 13px;
    font-weight: bold;
}
      .content{
            width: 1440px;
            height: 658px;
            max-width: 1440px;
           margin:auto
        }
        .bgimage{
            display:block;
            width: 1440px;
            height: 658px;
            angle: 0 deg;
            opacity: 1;
            object-fit: cover;
         }
         .imgtext{
            position: absolute;
            width: 1152;
            height: 329.8666687011719;
           top: 278px;
           left: 143px;
           angle: 0 deg;
           opacity: 1;
           gap: 48px;
        }
        .content2{
            width: 1440;
            height: auto;
            top: 830.33px;
            angle: 0 deg;
            opacity: 1;
            margin-top: 50px;
            padding-left: 30px;
        }
        .houses{
            width: 1320;
            height: 1024.14px;
            angle: 0 deg;
            opacity: 1;
            gap: 43px;
            margin-left: 55px;
        }
        .explore{
            width: 1320;
            height: 1024.1365966796875;
            angle: 0 deg;
            opacity: 1;
            text-align: center;
        }
       .row1{
           width: 1320;
           height: 386.06829833984375;
           angle: 0 deg;
           opacity: 1;
           gap: 11px;
           padding-top: 20px;
           padding-bottom: 20px;
       }
       .row2{
           width: 1320;
           height: 386.06829833984375;
           angle: 0 deg;
           opacity: 1;
           gap: 11px;
           padding-bottom: 20px;
       }
       .button{
        background-color: #278cff;
    border: none;
    border-radius: 5px;
    padding: 10px 20px;
    cursor: pointer;
    white-space: nowrap;
    margin-left: 600px;
}

.button a {
    color: white;
    font-size: 13px;
    text-decoration: none;
    font-weight: bold;
}
       .interior{
        width: 1297;
        height: 614;
        angle: 0 deg;
        opacity: 1;
       margin-left: 100px;
       margin-bottom: 50px;
       }
       .form {
    position: relative;
    width: 100%;
    min-height: 750px;
    overflow: hidden;
    margin-bottom: 50px;
}

/* Background image */
.form-img {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    z-index: 1;
}

.form-img img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
}

/* Text content on the left */
.form-text {
    position: absolute;
    top: 50%;
    left: 8.5%;
    transform: translateY(-50%);
    width: 55%;
    z-index: 2;
}

.form-text img {
    display: block;
    width: 100%;
    height: auto;
    object-fit: contain;
}

/* Form box on the right */
.form-box {
    position: absolute;
    top: 50%;
    right: 4.5%;
    transform: translateY(-50%);
    width: 27%;
    height: 500px; /* Decrease height */
    z-index: 3;
}

.form-box > img {
    width: 90%;
    height: 100%;
    object-fit: fill;
    display: block;
}

.enquiry {
    position: absolute;
    top: 3%;
    left: 3%;
    width: 86%;
    height: 94%;
    z-index: 4;
}

.enquiry img {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: contain;
    object-position: top center;
}
.featured{
    padding-left: 100px;
    padding-bottom: 50px;
}
.team{
    padding-left: 40px;
}

    </style>
</head>
<body>
    <div class="container">
        <nav class="navbar">
            <div class="logo">
                <img src="./assets/AdobeExpressPhotos_3204b9256eb647109525ad355496be04_CopyEdited.png" alt="Logo">
            </div>
            <div class="nav-menu">
               <a href="#">HOME</a>
               <a href="#">Explore</a>
               <a href="#">About Us</a>
               <a href="#">Contact Us</a>
               <button class="btn">
               <a href="#">Request a call</a>
               </button>
            </div>
        </nav>
        <div class="content">
            <section class="bgimage">
                <img src="./assets/540_rectangle.png" alt="Background Image">
                <div class="imgtext">
                  <img src="./assets/541_frame.png" alt="Text Image">
                </div>
            </section>
        </div>
        <div class="content2">
            <div class="houses">
             <div class="explore">
                <h2>Explore our properties</h2>
                <p>Enjoy the variety of 100+ Different properties in the market!</p>
             </div>
             <div class="row1">
                <img src="./assets/10_frame.png" alt="Homes">
             </div>
             <div class="row2">
                <img src="./assets/159_frame.png" alt="Homes">
             </div>
               <button class="button" type="submit">
               <a href="#"> Load More</a>
               </button>
            </div>
        </div>
        <div class="content3">
            <div class="interior">
                <img src="./assets/312_group.png">
            </div>
        </div>
        <div class="form">
                <div class="form-img">
                <img src="./assets/323_rectangle.png">
                </div>
                <div class="form-text">
                    <img src="./assets/324_group.png">
                </div>
                <div class="form-box">
                    <img src="./assets/345_rectangle.png" alt="">
                    <div class="enquiry">
                         <img src="./assets/346_frame.png">
                    </div>
                </div>
        </div>
        <div class="featured">
           <img src="./assets/380_frame.png" alt="">
        </div>
        <div class="team">
            <img src="./assets/505_group.png" alt="">
        </div>
        <div class="footer">
            <img src="./assets/600_frame.png" alt="">
        </div>
    </div>
</body>
</html>
